[project]
name = "secure-lost-found"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "Flask==3.1.3",
    "Flask-Limiter==4.1.1",
    "Flask-Login==0.6.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.2.2",
    "psycopg[binary]==3.3.5",
    "greenlet==3.2.5",
    "Jinja2==3.1.6",
    "joblib==1.5.0",
    "MarkupSafe==3.0.3",
    "numpy==2.2.5",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "Werkzeug==3.1.3"
]

[tool.vercel]
entrypoint = "run:app"